name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdfquery
    steps:
      - uses: actions/checkout@v4
        with:
          path: pdfquery
      # Source builds embed the isolated native entry. Merge pdfdom 0.2 before
      # merging/releasing this workflow; registry pdfdom 0.1 is not sufficient.
      - uses: actions/checkout@v4
        with:
          repository: okra-project/pdfdom
          path: pdfdom
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pdfquery/package-lock.json
      - run: npm install --omit=dev --ignore-scripts --no-audit --no-fund
        working-directory: pdfdom
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:dist
      - run: npm run test:install
      - run: npm run test:acceptance:syntax
      - run: npm run test:package
      - run: SIZE=$(gzip -c dist/index.js | wc -c); if [ $SIZE -gt 5120 ]; then echo "Bundle too large: $SIZE"; exit 1; fi
