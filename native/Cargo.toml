[package]
name = "pdfquery-native"
version = "0.3.0"
edition = "2021"
description = "Rust tagged-PDF query engine for the pdfquery npm package"
repository = "https://github.com/okrapdf/pdfquery"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
pdf-inspector = { path = "vendor/pdf-inspector", features = ["pdfquery-transform"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
wasm-bindgen = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lopdf = { version = "0.42", features = ["rayon"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
lopdf = { version = "0.42", default-features = false, features = ["wasm_js"] }

[dev-dependencies]
pretty_assertions = "1"

[patch.crates-io]
lopdf = { path = "vendor/lopdf" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[workspace]
members = ["vendor/pdf-inspector"]
exclude = ["vendor/lopdf"]
resolver = "2"
